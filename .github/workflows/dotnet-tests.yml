name: .NET Tests

on:
  push:
    branches:
      - main
      - BIB-*
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore BiblioSmart.sln
      - name: Build
        run: dotnet build BiblioSmart.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test BiblioSmart.sln --configuration Release --no-build
